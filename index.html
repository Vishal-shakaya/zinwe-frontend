<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Search + link-preview tags. Each public page sets its own (src/content/seo.ts); the build writes
         them into a static file per page (build/seoPages.ts). These are the home page's. -->
    <title>Small business data protection in plain English | Zinwe</title>
    <meta name="description" content="Data protection for small businesses with no IT team: know when files go to a USB drive, a remote-access tool runs or new software appears. Free for 3 PCs." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zinwe.io/" data-prerender />
    <!-- Google Search Console ownership of zinwe.io (also a DNS TXT record at the registrar). Keep it: removing
         it can drop the verification. -->
    <meta name="google-site-verification" content="OIvf9hcclvgK-eREAVnR6LiK7kLKOwfi_7ooYVKAKD0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Brand icons: generated from the founder's logo by design/brand/make_brand.py -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Link previews. og:image must be absolute; zinwe.io is the production domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zinwe" />
    <meta property="og:title" content="Zinwe — No IT team? It's OK. Data protection for small businesses." />
    <meta property="og:description" content="Know what's happening to your company's data. In plain English. No IT department needed." />
    <meta property="og:url" content="https://zinwe.io/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://zinwe.io/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Zinwe logo: an orange Z and the word inwe in charcoal." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zinwe — No IT team? It's OK. Data protection for small businesses." />
    <meta name="twitter:description" content="Know what's happening to your company's data. In plain English. No IT department needed." />
    <meta name="twitter:image" content="https://zinwe.io/brand/og-image.png" />
    <meta name="twitter:image:alt" content="The Zinwe logo: an orange Z and the word inwe in charcoal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
